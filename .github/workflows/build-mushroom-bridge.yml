name: Build Mushroom Bridge APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/MushroomBridge/**'
      - '.github/workflows/build-mushroom-bridge.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack source
        run: unzip -q android/MushroomBridge/MushroomBridge-android-source.zip -d /tmp/mushroom-bridge
      - name: Build debug APK
        working-directory: /tmp/mushroom-bridge/MushroomBridge
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MushroomBridge-debug-apk
          path: /tmp/mushroom-bridge/MushroomBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
