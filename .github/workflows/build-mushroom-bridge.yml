name: Build Mushroom Bridge APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/MushroomBridge/**'
      - '.github/workflows/build-mushroom-bridge.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Reconstruct source archive
        run: |
          mkdir -p /tmp/mushroom-bridge
          cat android/MushroomBridge/source-b64-00.txt \
              android/MushroomBridge/source-b64-01.txt \
              android/MushroomBridge/source-b64-02.txt \
            | base64 -d > /tmp/MushroomBridge-source.zip
          unzip -q /tmp/MushroomBridge-source.zip -d /tmp/mushroom-bridge || true
          cp android/MushroomBridge/GitHubUploader.java \
             /tmp/mushroom-bridge/app/src/main/java/cz/mushroomfarm/bridge/GitHubUploader.java
      - name: Build debug APK
        working-directory: /tmp/mushroom-bridge
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MushroomBridge-debug-apk
          path: /tmp/mushroom-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
